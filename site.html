```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro em Curso</title>
</head>

<body>

    <h1>Cadastro em Curso</h1>

    <form action="#" method="post">

        <!-- DADOS PESSOAIS -->
        <fieldset>
            <legend>Dados Pessoais</legend>

            <label for="nome">Nome:</label>
            <input 
                type="text" 
                id="nome" 
                name="nome"
                placeholder="Digite seu nome completo"
                required
                minlength="3"
            >
            <br><br>

            <label for="email">E-mail:</label>
            <input 
                type="email" 
                id="email" 
                name="email"
                placeholder="exemplo@email.com"
                required
            >
            <br><br>

            <label for="senha">Senha:</label>
            <input 
                type="password" 
                id="senha" 
                name="senha"
                placeholder="Digite sua senha"
                minlength="6"
                maxlength="20"
                required
            >
            <br><br>

            <label for="nascimento">Data de nascimento:</label>
            <input 
                type="date" 
                id="nascimento" 
                name="nascimento"
                required
            >
            <br><br>

            <label for="telefone">Telefone:</label>
            <input 
                type="tel" 
                id="telefone" 
                name="telefone"
                placeholder="(00) 00000-0000"
            >
            <br><br>

            <label for="idade">Idade:</label>
            <input 
                type="number" 
                id="idade" 
                name="idade"
                min="14"
                max="100"
                placeholder="Digite sua idade"
                required
            >

        </fieldset>

        <br>

        <!-- INFORMAÇÕES DO CURSO -->
        <fieldset>
            <legend>Informações do Curso</legend>

            <label for="curso">Curso de interesse:</label>
            <select id="curso" name="curso" required>
                <option value="">Selecione um curso</option>
                <option value="ads">Análise e Desenvolvimento de Sistemas</option>
                <option value="engenharia-software">Engenharia de Software</option>
                <option value="ciencia-dados">Ciência de Dados</option>
                <option value="redes">Redes de Computadores</option>
                <option value="seguranca">Segurança da Informação</option>
            </select>

            <br><br>

            <p>Modalidade:</p>

            <input 
                type="radio" 
                id="presencial" 
                name="modalidade" 
                value="presencial"
                required
            >
            <label for="presencial">Presencial</label>

            <br>

            <input 
                type="radio" 
                id="online" 
                name="modalidade" 
                value="online"
            >
            <label for="online">Online</label>

            <br>

            <input 
                type="radio" 
                id="hibrido" 
                name="modalidade" 
                value="hibrido"
            >
            <label for="hibrido">Híbrido</label>

            <br><br>

            <p>Áreas de interesse:</p>

            <input 
                type="checkbox" 
                id="programacao" 
                name="interesses" 
                value="programacao"
            >
            <label for="programacao">Programação</label>

            <br>

            <input 
                type="checkbox" 
                id="banco-dados" 
                name="interesses" 
                value="banco-dados"
            >
            <label for="banco-dados">Banco de Dados</label>

            <br>

            <input 
                type="checkbox" 
                id="web" 
                name="interesses" 
                value="desenvolvimento-web"
            >
            <label for="web">Desenvolvimento Web</label>

            <br>

            <input 
                type="checkbox" 
                id="seguranca" 
                name="interesses" 
                value="seguranca"
            >
            <label for="seguranca">Segurança da Informação</label>

        </fieldset>

        <br>

        <!-- INFORMAÇÕES ADICIONAIS -->
        <fieldset>
            <legend>Informações Adicionais</legend>

            <label for="observacoes">Observações ou comentários:</label>
            <br>

            <textarea 
                id="observacoes" 
                name="observacoes"
                rows="6"
                cols="50"
                placeholder="Digite aqui alguma observação ou comentário..."
                maxlength="500"
            ></textarea>

        </fieldset>

        <br>

        <!-- AÇÕES -->
        <input type="submit" value="Enviar formulário">
        <input type="reset" value="Limpar campos">

    </form>

</body>
</html>
```
