<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro em curso</title>
</head>
<body>
    <h1 id = "cadastro">
        <i class = "fa-solid fa-graduation-cap"></i>
        <i>Cadastro de cursos</i></h1>
    <br>

<form autocomplete="off" id="formulario-teste">
    <fieldset id = "pessoais">
        <legend>
            <i class="fa-solid fa-circle-user"></i><strong>Dados pessoais</strong>
        </legend>

        <label for = "nome">
            <i class="fa-solid fa-user"></i>
            Nome:</label>
        <input
            type = "text"
            id = "nome"
            name = "nome"
            required
            placeholder="Digite seu nome"
            min = "3"
        >
        <br><br>

        <label for = "email">
            <i class="fa-solid fa-envelope"></i>
            Email:</label>
        <input
            type = "email"
            id = "email"
            name = "email"
            required 
            placeholder="Digite seu email" 

        >
        <br> <br>

        <label for = "senha">
            <i class="fa-solid fa-lock"></i>
            Senha:</label>
        <input
            type = "password"
            id = "senha"
            placeholder="Digite sua senha"
            name="senha"
            required
            min="8"
        >
        <br><br>

        <label for = "data de nascimento" >
            <i class = "fa-solid fa-calendar"></i>
            Data de nascimento:</label>
        <input
            type = "date"
            id = "data"
            name = "data"
            placeholder="Digite sua data de nascimento"
            required
        >
        <br><br>

        <label for = "telefone">
            <i class="fa-solid fa-phone"></i>
            Telefone:</label>
        <input
            type = "tel"
            id="telefone"
            name = "telefone"
            placeholder="(00) 00000-0000"
            >
        <br><br>

        <label for = "idade">Idade:</label>
        <input
        type = "number"
        id="idade"
        name = "idade"
        placeholder="Sua idade">
    </fieldset>
    <br>
    <fieldset>
        <legend>
            <i class = "fa-solid fa-book"></i>
            <strong>Informações do curso</strong></legend>
        <label for = "curso"> Cursos de interesse </label>
        <select id = "curso" name ="curso" required>
            <option value = "">Selecione um curso</option>
            <option value = "ads">Análise e desenvolvimento de sistemas</option>
            <option value = "engenharia de Software">Engenharia de Software</option>
            <option value = "design">Ciência de dados</option>
            <option value = "redes">Rede de computadores</option>
        </select>
        <br><br>

        <p>Modalidade:</p>

        <input
            type = "radio"
            id = "presencial"
            name="modalidade"
            value = "presencial"
            required
        >

        <label for = "presencial">
            <i class="fa-solid fa-building"></i>
            Presencial</label>
        <br>

        <input
            type = "radio"
            id = "online"
            name="modalidade"
            value = "online"
        >

        <label for = "online">
            <i class="fa-solid fa-laptop"></i>
            Online</label>
        <br>
        <input
            type = "radio"
            id = "hibrido"
            name = "modalidade"
            value = "hibrido"
        >
        <label for = "hibrido">
            <i class="fa-solid fa-link"></i>
            Hibrido
        </label>
        <br><br>

        <p>Áreas de interesse:</p>
        <input
            type = "checkbox"
            id = "programacao"
            name = "interesse"
            value = "programacao"
        >

        <label for = "programacao">Programação</label>
        <br>

        <input
            type="checkbox"
            id ="banco-dados"
            name = "interesse"
            value = "banco-dados"
            >

        <label for = "banco-dados">Banco de dados</label>
        <br>

        <input
            type = "checkbox"
            id = "desenvolvimento"
            name = "interesse"
            value = "desenvolvimento"
        >
        <label for = "desenvolvimento">Desenvolvimento Web</label>




    </fieldset>
    <br>
<button  type = "submit" id = "enviar-dados">
     <i class="fa-solid fa-paper-plane"></i>
    Enviar dados</button>
<button typer = "reset" id = "limpar-dados">
    <i class="fa-solid fa-rotate"></i>
    Limpar dados</button>
</form>

        
        


    
</body>
</html>
