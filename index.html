<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro em curso</title>
</head>
<body>
    <h1>Cadastro de cursos</h1>

    <fieldset>
        <legend>Dados pessoais</legend>

        <label for = "nome">Nome:</label>
        <input
            type = "text"
            id = "nome"
            name = "nome"
            required
            placeholder="Digite seu nome"
            min = "3"
        >
        <br><br>

        <label for = "email">Email:</label>
        <input
            type = "email"
            id = "email"
            name = "email"
            required 
            placeholder="Digite seu email" 

        >
        <br> <br>

        <label for = "senha">Senha:</label>
        <input
            type = "password"
            id = "senha"
            placeholder="Digite sua senha"
            name="senha"
            required
            min="8"
        >
        <br><br>

        <label for = "data de nascimento">Data de nascimento:</label>
        <input
            type = "date"
            id = "data"
            name = "data"
            placeholder="Digite sua data de nascimento"
            required
        >
        <br><br>

        <label for = "telefone">Telefone:</label>
        <input
            type = "tel"
            id="telefone"
            name = "telefone"
            placeholder="(00) 00000-0000"
            >
        <br><br>

        <label for = "idade">Idade:</label>
        <input
        type = "number"
        id="idade"
        name = "idade"
        placeholder="Sua idade">
    </fieldset>
    <br>
    <fieldset>
        <legend>Informações do curso</legend>
        <label for = "curso"> Cursos de interesse </label>
        <select id = "curso" name ="curso" required>
            <option value = "">Selecione um curso</option>
            <option value = "ads">Análise e desenvolvimento de sistemas</option>
            <option value = "engenharia de Software">Engenharia de Software</option>
            <option value = "design">Ciência de dados</option>
            <option value = "redes">Rede de computadores</option>
        </select>
        <br><br>

        <p>Modalidade:</p>

        <input
            type = "radio"
            id = "presencial"
            name="modalidade"
            value = "presencial"
            required
        >

        <label for = "presencial">Presencial</label>
        <br>

        <input
            type = "radio"
            id = "online"
            name="modalidade"
            value = "online"
        >

        <label for = "online">Online</label>
        <br>
        <input
            type = "radio"
            id = "hibrido"
            name = "modalidade"
            value = "hibrido"
        >
        <label for = "hibrido">Hibrido</label>
        <br><br>

        <p>Áreas de interesse:</p>
        <input
            type = "checkbox"
            id = "programacao"
            name = "interesse"
            value = "programacao"
        >

        <label for = "programacao">Programação</label>
        <br>

        <input
            type="checkbox"
            id ="banco-dados"
            name = "interesse"
            value = "banco-dados"
            >

        <label for = "banco-dados">Banco de dados</label>
        <br>

        <input
            type = "checkbox"
            id = "desenvolvimento"
            name = "interesse"
            value = "desenvolvimento"
        >
        <label for = "desenvolvimento">Desenvolvimento Web</label>




    </fieldset>

        
        


    
</body>
</html>
